name: Build and Deploy

on:
  push:
    branches: [ master ]

jobs:
  name: Build and Deploy

  on:
    push:
      branches: [ master ]
    pull_request:
      branches: [ master ]

  concurrency:
    group: deployment-${{ github.ref }}
    cancel-in-progress: false

  jobs:
    validate:
      name: Validate & Type-Check
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4

        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: '20'
            cache: 'npm'

        - name: Install dependencies
          run: npm ci

        - name: Run TypeScript type-check
          run: npm run lint

        - name: Check build output size
          run: |
            npm run build > /dev/null 2>&1
            DIST_SIZE=$(du -sh dist/ | cut -f1)
            echo "Build output size: $DIST_SIZE"
            if [ $(du -s dist/ | cut -f1) -gt 524288 ]; then
              echo "⚠️  Warning: Build output exceeds 512MB"
            fi
          env:
            VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
            VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
            VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
            VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
            VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
            VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

    build-staging:
      name: Build for Staging
      runs-on: ubuntu-latest
      needs: validate
      if: github.event_name == 'pull_request'
      outputs:
        build-status: ${{ job.status }}
      steps:
        - uses: actions/checkout@v4

        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: '20'
            cache: 'npm'

        - name: Install dependencies
          run: npm ci

        - name: Build for staging
          run: npm run build
          env:
            VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
            VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
            VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
            VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
            VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
            VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

        - name: Upload build artifacts
          uses: actions/upload-artifact@v4
          with:
            name: staging-build
            path: dist/
            retention-days: 7

        - name: Deploy to Firebase Staging
          if: github.event_name == 'pull_request'
          uses: FirebaseExtended/action-hosting-deploy@v0
          with:
            repoToken: '${{ secrets.GITHUB_TOKEN }}'
            firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
            channelId: pr-${{ github.event.number }}
            projectId: alertgh-11142

    build-and-deploy-production:
      name: Build & Deploy to Production
      runs-on: ubuntu-latest
      needs: validate
      if: github.ref == 'refs/heads/master' && github.event_name == 'push'
      outputs:
        deployment-url: ${{ steps.deploy.outputs.urls }}
        deployment-status: ${{ job.status }}
      steps:
        - uses: actions/checkout@v4

        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: '20'
            cache: 'npm'

        - name: Install dependencies
          run: npm ci

        - name: Build production bundle
          run: npm run build
          env:
            VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
            VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
            VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
            VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
            VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
            VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

        - name: Upload production build artifacts
          uses: actions/upload-artifact@v4
          with:
            name: production-build
            path: dist/
            retention-days: 30

        - name: Deploy to Firebase Hosting (Production)
          id: deploy
          uses: FirebaseExtended/action-hosting-deploy@v0
          with:
            repoToken: '${{ secrets.GITHUB_TOKEN }}'
            firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
            channelId: live
            projectId: alertgh-11142

        - name: Comment deployment status on PR
          if: always()
          uses: actions/github-script@v7
          with:
            script: |
              const status = '${{ job.status }}' === 'success' ? '✅ Production deployment successful!' : '❌ Production deployment failed!';
              console.log(status);

    deployment-summary:
      name: Deployment Summary
      runs-on: ubuntu-latest
      if: always()
      needs: [validate, build-staging, build-and-deploy-production]
      steps:
        - name: Deployment Summary
          run: |
            echo "### Deployment Report" >> $GITHUB_STEP_SUMMARY
            echo "**Validation**: ${{ needs.validate.result }}" >> $GITHUB_STEP_SUMMARY
            echo "**Staging Build**: ${{ needs.build-staging.result }}" >> $GITHUB_STEP_SUMMARY
            echo "**Production Deployment**: ${{ needs.build-and-deploy-production.result }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
            echo "**Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
