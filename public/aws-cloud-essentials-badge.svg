<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 380" width="100%" height="100%">
  <!-- Badge Container Shape with Pointed Chevron Bottom -->
  <path d="M 20,20 L 300,20 L 300,310 L 160,360 L 20,310 Z" fill="#fcf8fa" stroke="#e04e96" stroke-width="9" stroke-linejoin="round"/>

  <!-- Inner Top White Box -->
  <rect x="30" y="30" width="260" height="235" fill="#ffffff" rx="2" />

  <!-- AWS Logo -->
  <g transform="translate(112, 42) scale(0.85)">
    <text x="45" y="38" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="#132135" text-anchor="middle" letter-spacing="-1">aws</text>
    <path d="M 12 48 Q 45 64 82 48" fill="none" stroke="#132135" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 82 48 L 73 43 L 78 54 Z" fill="#132135"/>
  </g>

  <!-- KNOWLEDGE Heading -->
  <text x="160" y="132" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="19" fill="#132135" text-anchor="middle" letter-spacing="4.5">KNOWLEDGE</text>
  
  <!-- Divider Line -->
  <line x1="55" y1="146" x2="265" y2="146" stroke="#132135" stroke-width="2" stroke-linecap="round" />

  <!-- Title Lines -->
  <text x="160" y="190" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="25" fill="#132135" text-anchor="middle">Cloud</text>
  <text x="160" y="222" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="25" fill="#132135" text-anchor="middle">Essentials</text>

  <!-- TRAINED Pink Banner -->
  <rect x="23.5" y="265" width="273" height="48" fill="#e04e96" />
  <text x="160" y="297" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" fill="#ffffff" text-anchor="middle" letter-spacing="6">TRAINED</text>
</svg>
